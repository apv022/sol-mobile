name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Sol's go.mod pins its toolchain (security fixes land there); let Go fetch it.
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./build.sh test
      - name: Build the APK
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sol-apk
          path: build/sol.apk
