name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Sol's go.mod pins its toolchain (security fixes land there); let Go fetch it.
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Resolve version and Sol ref
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "SOL_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags https://github.com/apv022/sol "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "SOL_REF=$TAG" >> "$GITHUB_ENV"
          else
            echo "SOL_REF=main" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./build.sh test

      - name: Build the release-signed APK
        env:
          KEYSTORE_B64: ${{ secrets.SOL_KEYSTORE_B64 }}
          SOL_KEYSTORE_PASS: ${{ secrets.SOL_KEYSTORE_PASS }}
          SOL_KEY_ALIAS: ${{ secrets.SOL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 SOL_KEYSTORE_PASS SOL_KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing; refusing to publish a debug-signed release"; exit 1; }
          done
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12")
          export SOL_KEYSTORE=$RUNNER_TEMP/release.p12
          ./build.sh

      - name: Verify signature
        env:
          BUILD_TOOLS_DIR: .toolchain/sdk/build-tools
        run: |
          set -euo pipefail
          export JAVA_HOME=$PWD/.toolchain/jdk PATH=$PWD/.toolchain/jdk/bin:$PATH
          bt=$(sed -n 's/^BUILD_TOOLS=\([0-9.]*\).*/\1/p' build.sh)
          "$BUILD_TOOLS_DIR/$bt/apksigner" verify --print-certs build/sol.apk | tee certs.txt
          grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*: //' > cert-sha256.txt
          test -s cert-sha256.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=sol-$SOL_VERSION.apk
          cp build/sol.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          sha=$(cut -d' ' -f1 SHA256SUMS)
          cert=$(cat cert-sha256.txt)
          commit=$(sed -n 's/^commit=//p' build/SOURCE)
          {
            echo "Sol for Android $SOL_VERSION."
            echo
            echo "## Install"
            echo
            echo "1. Download \`$apk\` on the phone (Android 8.0+, 64-bit ARM)."
            echo "2. Open it and allow installing from that source when Android asks."
            echo "3. If you installed the v0.1.0-alpha debug build, uninstall it once first: the signing key changed, so Android will not update over it."
            echo
            echo "## Checksums"
            echo
            echo "- APK SHA-256: \`$sha\`"
            echo "- Signing certificate SHA-256: \`$cert\`"
            echo "- Sol node: \`$SOL_REF\` at \`$commit\`"
          } > notes.md
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "$apk" SHA256SUMS --title "Sol for Android $SOL_VERSION" \
            --notes-file notes.md "${flags[@]}"

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
